qodana-code-quality:
  stage: quality
  image:
    name: jetbrains/qodana-js:2025.1
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
  allow_failure: true
  variables:
    GIT_DEPTH: 0
  cache:
    key: qodana-$CI_COMMIT_REF_SLUG
    paths:
      - .qodana/cache
  script:
    - qodana --cache-dir=$CI_PROJECT_DIR/.qodana/cache --results-dir=$CI_PROJECT_DIR/.qodana/results
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .qodana/results
