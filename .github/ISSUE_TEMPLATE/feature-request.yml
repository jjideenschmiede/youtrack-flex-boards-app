name: Feature Request
description: Suggest an idea for the Flex-Boards app.
title: "feat: "
labels: ["feature"]
assignees:
  - gowizzard
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! Please describe what you would like to achieve, so we can find the best solution together.
  - type: textarea
    id: problem
    attributes:
      label: Which problem would the feature solve?
      description: Describe the situation in your team or on your board where Flex-Boards doesn't help you yet.
      placeholder: We combine several states in one column, and it's hard to see …
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should the feature work?
      description: Describe the solution you have in mind, as detailed as possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Did you consider other solutions, for example a setting on the agile board or a workflow?
  - type: input
    id: youtrack-version
    attributes:
      label: YouTrack version
      description: You can find the version and build under Help at the bottom of the YouTrack sidebar.
      placeholder: 2026.2.19197
